name: Windows offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e skills/solidworks-windows/assets/vendor/solidworks-mcp pytest PyYAML
      - name: Test offline behavior
        run: python -m pytest tests skills/solidworks-windows/assets/vendor/solidworks-mcp/tests -q
